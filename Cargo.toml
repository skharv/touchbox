[package]
name = "touchbox"
version = "0.1.0"
edition = "2021"

[target.thumbv6m-none-eabi]
runner = "probe-run --chip RP2040"

[dependencies]
panic-halt = "0.2.0"
embedded-hal = "1.0.0"
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-graphics-core = "0.4.0"
display-interface = "0.4.1"
display-interface-spi = "0.4.1"
defmt = "0.3"
fugit = "0.3.0"
rp-pico = "0.9.0"
gc9a01a = "0.1.1"
embedded-graphics = "0.8.0"
cst816s = "0.1.4"
usb-device = "0.3"
usbd-hid = "0.7.0"
usbd-human-interface-device = "0.5.0"
packed_struct = { version = "0.10", default-features = false }
mcp230xx = { git = "https://github.com/skharv/mcp230xx.git" }
shared-bus = { version = "0.3.1" }
bit_field = "0.10.1"
num_enum = { version = "0.7.2", default-features = false }
paste = "1.0.8"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "touchbox"
path = "src/main.rs"
